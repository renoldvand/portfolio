<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Calculator</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Courier New", monospace;
        background: #1a1a2e;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .cx {
        max-width: 300px;
        width: 100%;
        background: #16213e;
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }
      .dp {
        background: #0f3460;
        border-radius: 10px;
        padding: 14px 18px;
        margin-bottom: 14px;
        text-align: right;
        min-height: 70px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
      }
      .dp .ex {
        font-size: 12px;
        color: #64748b;
        min-height: 16px;
      }
      .dp .rs {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: -1px;
      }
      .bg {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 7px;
      }
      .bg button {
        padding: 14px;
        border-radius: 9px;
        border: none;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.15s;
        font-family: inherit;
      }
      .bg button:active {
        transform: scale(0.95);
      }
      .bn {
        background: #1a1a2e;
        color: #e2e8f0;
      }
      .bn:hover {
        background: #1e2a45;
      }
      .bo {
        background: rgba(245, 158, 11, 0.12);
        color: #f59e0b;
      }
      .bo:hover {
        background: rgba(245, 158, 11, 0.2);
      }
      .be {
        background: #f59e0b;
        color: #1a1a2e;
      }
      .be:hover {
        background: #d97706;
      }
      .bcl {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
      }
      .bcl:hover {
        background: rgba(239, 68, 68, 0.2);
      }
      .bsp {
        grid-column: span 2;
      }
    </style>
  </head>
  <body>
    <div class="cx">
      <div class="dp">
        <div class="ex" id="ex"></div>
        <div class="rs" id="rs">0</div>
      </div>
      <div class="bg">
        <button class="bcl" onclick="cl()">C</button
        ><button class="bo" onclick="ao('(')">(</button
        ><button class="bo" onclick="ao(')')">)</button
        ><button class="bo" onclick="ao('/')">/</button
        ><button class="bn" onclick="an('7')">7</button
        ><button class="bn" onclick="an('8')">8</button
        ><button class="bn" onclick="an('9')">9</button
        ><button class="bo" onclick="ao('*')">x</button
        ><button class="bn" onclick="an('4')">4</button
        ><button class="bn" onclick="an('5')">5</button
        ><button class="bn" onclick="an('6')">6</button
        ><button class="bo" onclick="ao('-')">-</button
        ><button class="bn" onclick="an('1')">1</button
        ><button class="bn" onclick="an('2')">2</button
        ><button class="bn" onclick="an('3')">3</button
        ><button class="bo" onclick="ao('+')">+</button
        ><button class="bn bsp" onclick="an('0')">0</button
        ><button class="bn" onclick="an('.')">.</button
        ><button class="be" onclick="ca()">=</button>
      </div>
    </div>
    <div
      style="
        margin-top: 48px;
        padding: 24px 0;
        border-top: 1px solid rgba(128, 128, 128, 0.12);
        text-align: center;
      "
    >
      <a
        href="../../downloads/calculator.zip"
        download
        style="
          display: inline-block;
          padding: 13px 32px;
          border-radius: 8px;
          background: #2563eb;
          color: #fff;
          text-decoration: none;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: -0.3px;
        "
        >Download Source Code (.zip)</a
      >
    </div>
    <script>
      var ex = "";
      function an(n) {
        ex += n;
        ud();
      }
      function ao(o) {
        ex += o;
        ud();
      }
      function cl() {
        ex = "";
        document.getElementById("ex").textContent = "";
        document.getElementById("rs").textContent = "0";
      }
      function ud() {
        var d = ex;
        d = d.split("*").join(String.fromCharCode(215));
        d = d.split("/").join(String.fromCharCode(247));
        document.getElementById("ex").textContent = d;
      }
      function ca() {
        try {
          var r = Function('"use strict";return (' + ex + ")")();
          document.getElementById("rs").textContent = parseFloat(r.toFixed(8));
          ex = String(r);
        } catch (e) {
          document.getElementById("rs").textContent = "Error";
          ex = "";
        }
      }
    </script>
  </body>
</html>
