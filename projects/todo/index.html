<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>To Do List</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #f0f4f8;
        color: #1a202c;
        min-height: 100vh;
        padding: 32px;
      }
      .wrap {
        max-width: 560px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .sub {
        color: #718096;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .ar {
        display: flex;
        gap: 8px;
        margin-bottom: 20px;
      }
      .ar input {
        flex: 1;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1.5px solid #e2e8f0;
        background: #fff;
        color: #1a202c;
        font-size: 14px;
        outline: none;
      }
      .ar input:focus {
        border-color: #4299e1;
      }
      .ar button {
        padding: 10px 18px;
        border-radius: 8px;
        background: #4299e1;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 13px;
        font-weight: 600;
      }
      .ar button:hover {
        background: #3182ce;
      }
      .tl {
        list-style: none;
      }
      .ti {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 10px;
        background: #fff;
        border: 1.5px solid #e2e8f0;
        margin-bottom: 7px;
      }
      .ti:hover {
        border-color: #cbd5e0;
      }
      .ti.done span {
        text-decoration: line-through;
        color: #a0aec0;
      }
      .ti input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: #4299e1;
        cursor: pointer;
      }
      .ti span {
        flex: 1;
        font-size: 14px;
      }
      .ti .db {
        background: none;
        border: none;
        color: #e53e3e;
        cursor: pointer;
        font-size: 18px;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .empty {
        text-align: center;
        color: #a0aec0;
        padding: 36px;
        font-size: 13px;
      }
      .stats {
        display: flex;
        gap: 12px;
        margin-top: 16px;
        font-size: 12px;
        color: #718096;
      }
      .stats span {
        padding: 5px 12px;
        border-radius: 6px;
        background: #e2e8f0;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>To Do List</h1>
      <p class="sub">Kelola tugas harian kamu</p>
      <div class="ar">
        <input
          id="ti"
          placeholder="Tulis tugas baru..."
          onkeypress="if (event.key === 'Enter') at();"
        /><button onclick="at()">+ Tambah</button>
      </div>
      <ul class="tl" id="tl"></ul>
      <div class="empty" id="em">Belum ada tugas.</div>
      <div class="stats" id="st"></div>
    </div>
    <div
      style="
        margin-top: 48px;
        padding: 24px 0;
        border-top: 1px solid rgba(128, 128, 128, 0.12);
        text-align: center;
      "
    >
      <a
        href="../../downloads/todo-list.zip"
        download
        style="
          display: inline-block;
          padding: 13px 32px;
          border-radius: 8px;
          background: #2563eb;
          color: #fff;
          text-decoration: none;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: -0.3px;
        "
        >Download Source Code (.zip)</a
      >
    </div>
    <script>
      var ts = JSON.parse(localStorage.getItem("rt") || "[]");

      function rn() {
        var l = document.getElementById("tl");
        var e = document.getElementById("em");
        var s = document.getElementById("st");

        l.innerHTML = "";

        if (!ts.length) {
          e.style.display = "block";
          s.innerHTML = "";
          return;
        }

        e.style.display = "none";

        var d = ts.filter(function (t) {
          return t.d;
        }).length;

        s.innerHTML = `
      <span>Total: ${ts.length}</span>
      <span>Selesai: ${d}</span>
      <span>Belum: ${ts.length - d}</span>
    `;

        ts.forEach(function (t, i) {
          var li = document.createElement("li");
          li.className = "ti" + (t.d ? " done" : "");

          li.innerHTML = `
        <input type="checkbox" ${t.d ? "checked" : ""}>
        <span>${t.t}</span>
        <button class="db">x</button>
      `;

          var cb = li.querySelector('input[type="checkbox"]');
          var db = li.querySelector(".db");

          cb.addEventListener("change", function () {
            tg(i);
          });

          db.addEventListener("click", function () {
            dl(i);
          });

          l.appendChild(li);
        });
      }

      function at() {
        var inp = document.getElementById("ti");
        var txt = inp.value.trim();

        if (!txt) return;

        ts.push({
          t: txt,
          d: false,
        });

        inp.value = "";

        sv();
        rn();
      }

      function tg(i) {
        ts[i].d = !ts[i].d;
        sv();
        rn();
      }

      function dl(i) {
        ts.splice(i, 1);
        sv();
        rn();
      }

      function sv() {
        localStorage.setItem("rt", JSON.stringify(ts));
      }

      rn();
    </script>
  </body>
</html>
