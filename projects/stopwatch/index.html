<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Stopwatch</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #1a1a1a;
        color: #e5e5e5;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      h1 {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 32px;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #737373;
      }
      .swt {
        font-size: 64px;
        font-weight: 200;
        letter-spacing: -3px;
        font-variant-numeric: tabular-nums;
        margin-bottom: 32px;
      }
      .swms {
        font-size: 36px;
        color: #ef4444;
      }
      .swb {
        display: flex;
        gap: 10px;
        margin-bottom: 28px;
      }
      .swb button {
        padding: 12px 28px;
        border-radius: 8px;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
      .bs2 {
        background: #ef4444;
        color: #fff;
      }
      .bs2:hover {
        background: #dc2626;
      }
      .bx {
        background: #374151;
        color: #fff;
      }
      .bx:hover {
        background: #4b5563;
      }
      .br {
        background: rgba(255, 255, 255, 0.06);
        color: #e5e5e5;
      }
      .br:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .bl {
        background: rgba(255, 255, 255, 0.06);
        color: #e5e5e5;
      }
      .bl:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .laps {
        width: 100%;
        max-width: 380px;
      }
      .laps h3 {
        font-size: 11px;
        color: #525252;
        margin-bottom: 10px;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .li {
        display: flex;
        justify-content: space-between;
        padding: 9px 12px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.03);
        margin-bottom: 4px;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .li .ln {
        color: #ef4444;
      }
    </style>
  </head>
  <body>
    <h1>Stopwatch</h1>
    <div class="swt" id="d2">00:00<span class="swms">.00</span></div>
    <div class="swb">
      <button class="bs2" id="sb2" onclick="tt()">Start</button
      ><button class="bl" id="lb" onclick="al()" style="display: none">
        Lap</button
      ><button class="br" onclick="rs2()">Reset</button>
    </div>
    <div class="laps" id="lc"></div>
    <div
      style="
        margin-top: 48px;
        padding: 24px 0;
        border-top: 1px solid rgba(128, 128, 128, 0.12);
        text-align: center;
      "
    >
      <a
        href="../../downloads/stopwatch.zip"
        download
        style="
          display: inline-block;
          padding: 13px 32px;
          border-radius: 8px;
          background: #2563eb;
          color: #fff;
          text-decoration: none;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: -0.3px;
        "
        >Download Source Code (.zip)</a
      >
    </div>
    <script>
      var rn = false,
        iv,
        st = 0,
        el = 0,
        laps = [];
      function tt() {
        if (rn) sp();
        else go();
      }
      function go() {
        rn = true;
        document.getElementById("sb2").textContent = "Stop";
        document.getElementById("sb2").className = "bx";
        document.getElementById("lb").style.display = "inline-block";
        st = Date.now() - el;
        iv = setInterval(ud, 10);
      }
      function sp() {
        rn = false;
        document.getElementById("sb2").textContent = "Start";
        document.getElementById("sb2").className = "bs2";
        clearInterval(iv);
      }
      function rs2() {
        sp();
        el = 0;
        laps = [];
        document.getElementById("d2").innerHTML =
          '00:00<span class="swms">.00</span>';
        document.getElementById("lc").innerHTML = "";
      }
      function ud() {
        el = Date.now() - st;
        var ms = Math.floor((el % 1000) / 10),
          s = Math.floor((el / 1000) % 60),
          m = Math.floor(el / 60000);
        document.getElementById("d2").innerHTML =
          pd(m) + ":" + pd(s) + '<span class="swms">.' + pd(ms) + "</span>";
      }
      function pd(n) {
        return n < 10 ? "0" + n : n;
      }
      function al() {
        laps.push(el);
        var c = document.getElementById("lc");
        c.innerHTML =
          "<h3>Lap Times</h3>" +
          laps
            .map(function (l, i) {
              var ms = Math.floor((l % 1000) / 10),
                s = Math.floor((l / 1000) % 60),
                m = Math.floor(l / 60000);
              return (
                '<div class="li"><span class="ln">Lap ' +
                (i + 1) +
                "</span><span>" +
                pd(m) +
                ":" +
                pd(s) +
                "." +
                pd(ms) +
                "</span></div>"
              );
            })
            .reverse()
            .join("");
      }
    </script>
  </body>
</html>
