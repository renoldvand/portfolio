<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Image Gallery</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: #111;
        color: #e5e5e5;
        min-height: 100vh;
        padding: 32px;
      }
      .wrap {
        max-width: 800px;
        margin: 0 auto;
      }
      h1 {
        font-size: 24px;
        font-weight: 600;
        margin-bottom: 4px;
      }
      .sub {
        color: #525252;
        font-size: 13px;
        margin-bottom: 20px;
      }
      .gg {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 6px;
      }
      .gi {
        border-radius: 6px;
        overflow: hidden;
        cursor: pointer;
        position: relative;
        aspect-ratio: 1;
        transition: transform 0.3s;
      }
      .gi:hover {
        transform: scale(1.03);
      }
      .gi img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .gi .ov {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.7),
          transparent 60%
        );
        opacity: 0;
        transition: opacity 0.3s;
        display: flex;
        align-items: flex-end;
        padding: 12px;
      }
      .gi:hover .ov {
        opacity: 1;
      }
      .ov span {
        font-size: 12px;
        font-weight: 500;
      }
      .lb {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.95);
        z-index: 999;
        align-items: center;
        justify-content: center;
      }
      .lb.show {
        display: flex;
      }
      .lb img {
        max-width: 88vw;
        max-height: 82vh;
        border-radius: 6px;
        object-fit: contain;
      }
      .lb .xbtn {
        position: absolute;
        top: 16px;
        right: 20px;
        font-size: 24px;
        color: #fff;
        background: none;
        border: none;
        cursor: pointer;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s;
      }
      .lb .xbtn:hover {
        background: rgba(255, 255, 255, 0.1);
      }
      .lb .nb {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        font-size: 24px;
        color: #fff;
        background: rgba(255, 255, 255, 0.06);
        border: none;
        width: 44px;
        height: 44px;
        border-radius: 50%;
        cursor: pointer;
        transition: background 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .lb .nb:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .pv {
        left: 16px;
      }
      .nx {
        right: 16px;
      }
      .lb .cap {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 13px;
        color: #888;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Image Gallery</h1>
      <p class="sub">Klik gambar untuk memperbesar</p>
      <div class="gg" id="gg"></div>
    </div>
    <div class="lb" id="lb">
      <button class="xbtn" onclick="clb()">x</button
      ><button class="nb pv" onclick="nbv(-1)">&lt;</button
      ><img id="li" src="" /><button class="nb nx" onclick="nbv(1)">
        &gt;
      </button>
      <div class="cap" id="lc2"></div>
    </div>
    <div
      style="
        margin-top: 48px;
        padding: 24px 0;
        border-top: 1px solid rgba(128, 128, 128, 0.12);
        text-align: center;
      "
    >
      <a
        href="../../downloads/image-gallery.zip"
        download
        style="
          display: inline-block;
          padding: 13px 32px;
          border-radius: 8px;
          background: #2563eb;
          color: #fff;
          text-decoration: none;
          font-size: 14px;
          font-weight: 600;
          letter-spacing: -0.3px;
        "
        >Download Source Code (.zip)</a
      >
    </div>
    <script>
      var imgs = [
          {
            s: "https://picsum.photos/seed/rm1/500/500",
            c: "Kamera",
          },
          { s: "https://picsum.photos/seed/rm2/500/500", c: "Pemandangan Alam" },
          { s: "https://picsum.photos/seed/rm3/500/500", c: "Tertidur di Mobil" },
          { s: "https://picsum.photos/seed/rm4/500/500", c: "Langit Biru" },
          { s: "https://picsum.photos/seed/rm5/500/500", c: "Pemandangan Pagi" },
          { s: "https://picsum.photos/seed/rm6/500/500", c: "Kota" },
          { s: "https://picsum.photos/seed/rm7/500/500", c: "Jalan Raya" },
          { s: "https://picsum.photos/seed/rm8/500/500", c: "Bangunan" },
          { s: "https://picsum.photos/seed/rm9/500/500", c: "Lautan" },
          { s: "https://picsum.photos/seed/rm10/500/500", c: "Kamar" },
          { s: "https://picsum.photos/seed/rm11/500/500", c: "Jembatan" },
          { s: "https://picsum.photos/seed/rm12/500/500", c: "Daun Mati" },
        ],
        ci = 0;
      function rg() {
        document.getElementById("gg").innerHTML = imgs
          .map(function (m, i) {
            return (
              '<div class="gi" onclick="olb(' +
              i +
              ')"><img src="' +
              m.s +
              '" alt="' +
              m.c +
              '" loading="lazy"><div class="ov"><span>' +
              m.c +
              "</span></div></div>"
            );
          })
          .join("");
      }
      function olb(i) {
        ci = i;
        document.getElementById("li").src = imgs[i].s;
        document.getElementById("lc2").textContent = imgs[i].c;
        document.getElementById("lb").classList.add("show");
      }
      function clb() {
        document.getElementById("lb").classList.remove("show");
      }
      function nbv(d) {
        ci = (ci + d + imgs.length) % imgs.length;
        document.getElementById("li").src = imgs[ci].s;
        document.getElementById("lc2").textContent = imgs[ci].c;
      }
      document.addEventListener("keydown", function (e) {
        if (!document.getElementById("lb").classList.contains("show")) return;
        if (e.key === "Escape") clb();
        if (e.key === "ArrowLeft") nbv(-1);
        if (e.key === "ArrowRight") nbv(1);
      });
      rg();
    </script>
  </body>
</html>
