<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Sistem Kasir</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Courier New',monospace;background:#fef3c7;color:#78350f;min-height:100vh;padding:32px}.wrap{max-width:650px;margin:0 auto}h1{font-size:22px;margin-bottom:4px}.sub{color:#92400e;font-size:12px;margin-bottom:20px}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:20px}.pc{padding:14px;border-radius:8px;background:#fff;border:1.5px solid #fcd34d;cursor:pointer;transition:all .2s;text-align:center}.pc:hover{background:#fef9c3;border-color:#f59e0b;transform:translateY(-2px)}.pc .pn{font-size:12px;font-weight:600;margin-bottom:2px}.pc .pp{color:#b45309;font-size:11px;font-weight:700}.ct{background:#fff;border:1.5px solid #fcd34d;border-radius:10px;padding:18px}.ct h3{margin-bottom:10px;font-size:14px}.ci{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px dashed #fcd34d;font-size:12px}.ci .cq{display:flex;align-items:center;gap:5px}.ci .cq button{width:22px;height:22px;border-radius:4px;border:1px solid #fcd34d;background:#fef3c7;color:#78350f;cursor:pointer;font-size:12px;font-family:inherit}.ci .cr{color:#dc2626;cursor:pointer;background:none;border:none;font-size:14px}.ct2{display:flex;justify-content:space-between;padding:10px 0 0;font-size:15px;font-weight:700;border-top:2px solid #f59e0b;margin-top:6px}.ct2 .tp{color:#b45309}.cb{width:100%;padding:10px;border-radius:6px;background:#d97706;color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:600;margin-top:8px;font-family:inherit}.cb:hover{background:#b45309}.ec{text-align:center;color:#92400e;padding:16px;font-size:11px}.rc{display:none;margin-top:12px;padding:14px;border-radius:8px;background:#fffbeb;border:1px dashed #fcd34d;font-size:10px;line-height:1.7;white-space:pre;color:#78350f}</style></head><body><div class="wrap"><h1>Sistem Kasir</h1><p class="sub">Klik produk untuk menambahkan ke keranjang</p><div class="pg" id="pg"></div><div class="ct"><h3>Keranjang</h3><div id="ci3"><div class="ec">Keranjang kosong</div></div><div class="ct2" id="ct2" style="display:none"><span>Total</span><span class="tp" id="tp2">Rp 0</span></div><button class="cb" id="cb3" style="display:none" onclick="ck()">Cetak Struk</button><div class="rc" id="rc"></div></div></div><div style="margin-top:48px;padding:24px 0;border-top:1px solid rgba(128,128,128,0.12);text-align:center"><a href="../../downloads/sistem-kasir.zip" download style="display:inline-block;padding:13px 32px;border-radius:8px;background:#2563eb;color:#fff;text-decoration:none;font-size:14px;font-weight:600;letter-spacing:-0.3px">Download Source Code (.zip)</a></div><script>var ps=[{n:"Nasi Goreng",p:15000},{n:"Mie Ayam",p:12000},{n:"Bakso",p:10000},{n:"Es Teh",p:5000},{n:"Es Jeruk",p:7000},{n:"Kopi",p:6000},{n:"Ayam Geprek",p:18000},{n:"Sate",p:20000}],cart=[];function rp(){var c=document.getElementById("pg");c.innerHTML="";ps.forEach(function(p,i){c.innerHTML+='<div class="pc" onclick="ac('+i+')"><div class="pn">'+p.n+'</div><div class="pp">Rp '+p.p.toLocaleString()+'</div></div>';});}function ac(i){var e=cart.find(function(c){return c.n===ps[i].n});if(e)e.q++;else cart.push({n:ps[i].n,p:ps[i].p,q:1});rc2();}function rc2(){var c=document.getElementById("ci3"),t=document.getElementById("ct2"),b=document.getElementById("cb3");if(!cart.length){c.innerHTML='<div class="ec">Keranjang kosong</div>';t.style.display="none";b.style.display="none";return;}t.style.display="flex";b.style.display="block";var h="",tot=0;cart.forEach(function(x,i){var s=x.p*x.q;tot+=s;h+='<div class="ci"><span>'+x.n+'</span><div class="cq"><button onclick="cq2('+i+',-1)">-</button><span>'+x.q+'</span><button onclick="cq2('+i+',1)">+</button></div><span>Rp '+s.toLocaleString()+'</span><button class="cr" onclick="ri('+i+')">x</button></div>';});c.innerHTML=h;document.getElementById("tp2").textContent="Rp "+tot.toLocaleString();}function cq2(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);rc2();}function ri(i){cart.splice(i,1);rc2();}function ck(){var tot=0,l="================================\n     STRUK PEMBAYARAN\n     Toko Rama Kasir\n================================\nNo  Item          Harga\n--------------------------------\n";cart.forEach(function(x,i){var s=x.p*x.q;tot+=s;var n=(i+1)+". "+x.n;while(n.length<15)n+=" ";l+=n+"Rp "+s.toLocaleString()+"\n";});l+="================================\nTOTAL:            Rp "+tot.toLocaleString()+"\n================================\n   Terima kasih!\n";var r=document.getElementById("rc");r.textContent=l;r.style.display="block";}rp();</script></body></html>
