<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Login</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: #fff;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .box {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.15);
        border-radius: 14px;
        padding: 32px;
        width: 90%;
        max-width: 380px;
      }
      .box h2 {
        margin-bottom: 18px;
        font-size: 20px;
      }
      .fg {
        margin-bottom: 12px;
      }
      .fg label {
        display: block;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.6);
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .fg input {
        width: 100%;
        padding: 10px 14px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        font-size: 14px;
        outline: none;
      }
      .fg input:focus {
        border-color: rgba(255, 255, 255, 0.4);
      }
      .sb {
        width: 100%;
        padding: 11px;
        border-radius: 8px;
        background: #fff;
        color: #667eea;
        border: none;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        margin-top: 6px;
      }
      .sb:hover {
        background: #f0f0ff;
      }
      .msg {
        padding: 10px;
        border-radius: 8px;
        font-size: 12px;
        margin-top: 10px;
        display: none;
      }
      .msg.show {
        display: block;
      }
      .msg.ok {
        background: rgba(34, 197, 94, 0.2);
        color: #bbf7d0;
      }
      .msg.err {
        background: rgba(239, 68, 68, 0.2);
        color: #fecaca;
      }
      .blink {
        text-align: center;
        font-size: 12px;
        color: rgba(255, 255, 255, 0.5);
        margin-top: 14px;
      }
      .blink a {
        color: #fff;
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <h2>Login</h2>
      <div class="fg">
        <label>Username</label><input id="lu" placeholder="Masukkan username" />
      </div>
      <div class="fg">
        <label>Password</label
        ><input id="lp" type="password" placeholder="Masukkan password" />
      </div>
      <button class="sb" onclick="doLogin()">Login</button>
      <div class="msg" id="lm"></div>
      <div class="blink">
        Belum punya akun? <a href="register.html">Daftar</a>
      </div>
    </div>
    <script>
      var us = JSON.parse(localStorage.getItem("rl_u") || "[]");
      function sm(id, t, c) {
        var e = document.getElementById(id);
        e.className = "msg show " + c;
        e.textContent = t;
      }
      function doLogin() {
        var u = document.getElementById("lu").value.trim(),
          p = document.getElementById("lp").value;
        if (!u || !p) {
          sm("lm", "Semua field harus diisi!", "err");
          return;
        }
        var f = us.find(function (x) {
          return x.u === u && x.p === p;
        });
        if (f) {
          sm("lm", "Login berhasil! Selamat datang, " + f.n, "ok");
        } else {
          sm("lm", "Username atau password salah!", "err");
        }
      }
    </script>
  </body>
</html>
