<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Login & Register</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}.wrap{text-align:center;max-width:500px;width:100%}h1{font-size:28px;font-weight:700;margin-bottom:6px}.sub{color:rgba(255,255,255,.7);font-size:14px;margin-bottom:32px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:32px 20px;border-radius:14px;background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);transition:all .3s;cursor:pointer}.card:hover{background:rgba(255,255,255,.18);transform:translateY(-3px)}.card h3{font-size:18px;margin-bottom:6px}.card p{font-size:12px;color:rgba(255,255,255,.65);margin-bottom:18px;line-height:1.5}.card a{display:inline-block;padding:10px 24px;border-radius:8px;font-size:13px;font-weight:600;transition:all .3s;text-decoration:none}.c1 a{background:#fff;color:#667eea}.c1 a:hover{background:#f0f0ff}.c2 a{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.2)}.c2 a:hover{background:rgba(255,255,255,.25)}.note{margin-top:24px;padding:12px 16px;border-radius:8px;background:rgba(0,0,0,.15);font-size:11px;color:rgba(255,255,255,.6);line-height:1.6}@media(max-width:480px){.cards{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Login &amp; Register</h1><p class="sub">Sistem autentikasi pengguna</p><div class="cards"><div class="card c1"><h3>Login</h3><p>Masuk ke akun yang sudah terdaftar</p><a href="login.html">Masuk</a></div><div class="card c2"><h3>Register</h3><p>Buat akun baru terlebih dahulu</p><a href="register.html">Daftar</a></div></div><div class="note">Ini adalah demo frontend. Untuk source code asli (PHP + MySQL + Session), silakan download ZIP.</div></div><script></script></body></html>
