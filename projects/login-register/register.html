<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Register</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:system-ui,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}.box{background:rgba(255,255,255,.1);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:32px;width:90%;max-width:380px}.box h2{margin-bottom:18px;font-size:20px}.fg{margin-bottom:12px}.fg label{display:block;font-size:11px;color:rgba(255,255,255,.6);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}.fg input{width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:#fff;font-size:14px;outline:none}.fg input:focus{border-color:rgba(255,255,255,.4)}.sb{width:100%;padding:11px;border-radius:8px;background:#fff;color:#667eea;border:none;cursor:pointer;font-size:14px;font-weight:600;margin-top:6px}.sb:hover{background:#f0f0ff}.msg{padding:10px;border-radius:8px;font-size:12px;margin-top:10px;display:none}.msg.show{display:block}.msg.ok{background:rgba(34,197,94,.2);color:#bbf7d0}.msg.err{background:rgba(239,68,68,.2);color:#fecaca}.blink{text-align:center;font-size:12px;color:rgba(255,255,255,.5);margin-top:14px}.blink a{color:#fff;text-decoration:underline}</style></head><body><div class="box"><h2>Register</h2><div class="fg"><label>Nama Lengkap</label><input id="rn" placeholder="Masukkan nama"></div><div class="fg"><label>Username</label><input id="ru" placeholder="Buat username"></div><div class="fg"><label>Password</label><input id="rp" type="password" placeholder="Buat password"></div><div class="fg"><label>Konfirmasi Password</label><input id="rp2" type="password" placeholder="Ulangi password"></div><button class="sb" onclick="doReg()">Register</button><div class="msg" id="rm"></div><div class="blink">Sudah punya akun? <a href="login.html">Login</a></div></div><script>var us=JSON.parse(localStorage.getItem("rl_u")||"[]");function sm(id,t,c){var e=document.getElementById(id);e.className="msg show "+c;e.textContent=t;}function doReg(){var n=document.getElementById("rn").value.trim(),u=document.getElementById("ru").value.trim(),p=document.getElementById("rp").value,p2=document.getElementById("rp2").value;if(!n||!u||!p){sm("rm","Semua field harus diisi!","err");return;}if(p!==p2){sm("rm","Password tidak cocok!","err");return;}if(us.find(function(x){return x.u===u})){sm("rm","Username sudah dipakai!","err");return;}us.push({n:n,u:u,p:p});localStorage.setItem("rl_u",JSON.stringify(us));sm("rm","Registrasi berhasil! Silakan login.","ok");}</script></body></html>
